<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Left Card (Ace of Spades) -->
  <g transform="translate(130, 110) rotate(-10)">
    <rect width="160" height="230" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))" />
    <text x="20" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a">A</text>
    <!-- Spade -->
    <path d="M 80 90 C 80 90, 50 130, 50 150 C 50 168, 66 178, 77 170 C 80 167, 80 178, 74 195 L 86 195 C 80 178, 80 167, 83 170 C 94 178, 110 168, 110 150 C 110 130, 80 90, 80 90 Z" fill="#0f172a" />
  </g>

  <!-- Right Card (Ace of Hearts) -->
  <g transform="translate(230, 125) rotate(12)">
    <rect width="160" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.4))" />
    <text x="20" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#dc2626">A</text>
    <!-- Heart -->
    <path d="M 80 115 C 80 115, 52 85, 52 120 C 52 145, 80 175, 80 175 C 80 175, 108 145, 108 120 C 108 85, 80 115, 80 115 Z" fill="#dc2626" />
  </g>

  <!-- App Title Text -->
  <text x="256" y="415" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="800" fill="#fde047" letter-spacing="2">شلم پرو</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#a7f3d0" letter-spacing="4">SHELEM PRO</text>
</svg>
