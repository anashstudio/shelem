<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Midnight Royal Emerald / Indigo -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#03130e" />
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Ruby Red Gradient (Hearts) -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Sapphire Blue / Electric Spades -->
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Amber Diamond Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Clubs Gradient -->
    <linearGradient id="clubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowDark" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />
  
  <!-- Outer Gold Luxury Inset Border -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="url(#goldSheen)" stroke-width="4" stroke-opacity="0.55" />
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="#fde047" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="6 4" />

  <!-- Background Ambient Glow behind cards -->
  <circle cx="256" cy="220" r="160" fill="#10b981" opacity="0.12" filter="blur(30px)" />
  <circle cx="256" cy="190" r="110" fill="#fde047" opacity="0.10" filter="blur(20px)" />

  <!-- The Golden Royal Crown of Hakem (Top of cards) -->
  <g transform="translate(256, 75)" filter="url(#goldGlow)">
    <!-- Crown Path -->
    <path d="M -52 35 L -62 0 L -28 18 L 0 -14 L 28 18 L 62 0 L 52 35 Z" fill="url(#goldSheen)" stroke="#78350f" stroke-width="2" />
    <!-- Crown Base Band -->
    <rect x="-50" y="32" width="100" height="9" rx="3" fill="#ca8a04" stroke="#fef08a" stroke-width="1" />
    <!-- Crown Gemstones: Ruby, Emerald, Sapphire -->
    <circle cx="-32" cy="36.5" r="3.5" fill="url(#rubyGrad)" />
    <circle cx="0" cy="36.5" r="4" fill="url(#diamondGrad)" />
    <circle cx="32" cy="36.5" r="3.5" fill="url(#spadeGrad)" />
    <!-- Crown Top Orbs -->
    <circle cx="-62" cy="0" r="4" fill="#fef08a" />
    <circle cx="0" cy="-14" r="5" fill="#fef08a" />
    <circle cx="62" cy="0" r="4" fill="#fef08a" />
  </g>

  <!-- Left Playing Card: Ace of Spades (Rotated -12 deg) -->
  <g transform="translate(135, 120) rotate(-12)" filter="url(#shadowDark)">
    <rect width="148" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Card Border Inset -->
    <rect x="8" y="8" width="132" height="200" rx="9" fill="none" stroke="#e2e8f0" stroke-width="1" />
    <!-- Top-left Rank -->
    <text x="18" y="38" font-family="'Vazirmatn', -apple-system, sans-serif" font-size="26" font-weight="900" fill="#0f172a">A</text>
    <!-- Top-left Small Spade -->
    <path d="M 23 48 C 23 48, 14 62, 14 68 C 14 74, 19 77, 22.5 74 C 23.5 73, 23.5 77, 21.5 83 L 25.5 83 C 23.5 77, 23.5 73, 24.5 74 C 28 77, 33 74, 33 68 C 33 62, 23 48, 23 48 Z" fill="url(#spadeGrad)" />
    <!-- Center Big Spade (Sapphire Metallic Gradient) -->
    <path d="M 74 95 C 74 95, 42 140, 42 158 C 42 174, 56 182, 69 176 C 73 174, 73 182, 67 197 L 81 197 C 75 182, 75 174, 79 176 C 92 182, 106 174, 106 158 C 106 140, 74 95, 74 95 Z" fill="url(#spadeGrad)" />
    <!-- Bottom-right Rank Inverted -->
    <text x="130" y="196" font-family="'Vazirmatn', -apple-system, sans-serif" font-size="26" font-weight="900" fill="#0f172a" text-anchor="end" transform="rotate(180 120 186)">A</text>
  </g>

  <!-- Right Playing Card: Ace of Hearts (Rotated +12 deg) -->
  <g transform="translate(230, 135) rotate(12)" filter="url(#shadowDark)">
    <rect width="148" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Card Border Inset -->
    <rect x="8" y="8" width="132" height="200" rx="9" fill="none" stroke="#fee2e2" stroke-width="1" />
    <!-- Top-left Rank -->
    <text x="18" y="38" font-family="'Vazirmatn', -apple-system, sans-serif" font-size="26" font-weight="900" fill="#e11d48">A</text>
    <!-- Top-left Small Heart -->
    <path d="M 23 53 C 23 53, 15 42, 15 54 C 15 62, 23 71, 23 71 C 23 71, 31 62, 31 54 C 31 42, 23 53, 23 53 Z" fill="url(#rubyGrad)" />
    <!-- Center Big Heart (Ruby Glow Gradient) -->
    <path d="M 74 116 C 74 116, 44 85, 44 122 C 44 148, 74 180, 74 180 C 74 180, 104 148, 104 122 C 104 85, 74 116, 74 116 Z" fill="url(#rubyGrad)" filter="url(#goldGlow)" />
    <!-- Bottom-right Rank Inverted -->
    <text x="130" y="196" font-family="'Vazirmatn', -apple-system, sans-serif" font-size="26" font-weight="900" fill="#e11d48" text-anchor="end" transform="rotate(180 120 186)">A</text>
  </g>

  <!-- Four Floating Colored Suit Gems (Top & Side Accents) -->
  <!-- ♠ Top-Left Sapphire Spade -->
  <g transform="translate(62, 110) scale(0.65)" filter="url(#shadowDark)">
    <circle cx="28" cy="28" r="24" fill="#0f172a" stroke="url(#spadeGrad)" stroke-width="2.5" />
    <path d="M 28 14 C 28 14, 16 30, 16 36 C 16 41, 21 44, 25 41 C 26 40, 26 43, 24 47 L 32 47 C 30 43, 30 40, 31 41 C 35 44, 40 41, 40 36 C 40 30, 28 14, 28 14 Z" fill="url(#spadeGrad)" />
  </g>

  <!-- ♥ Top-Right Ruby Heart -->
  <g transform="translate(408, 110) scale(0.65)" filter="url(#shadowDark)">
    <circle cx="28" cy="28" r="24" fill="#450a0a" stroke="url(#rubyGrad)" stroke-width="2.5" />
    <path d="M 28 20 C 28 20, 17 12, 17 22 C 17 29, 28 39, 28 39 C 28 39, 39 29, 39 22 C 39 12, 28 20, 28 20 Z" fill="url(#rubyGrad)" />
  </g>

  <!-- ♦ Bottom-Left Amber Diamond -->
  <g transform="translate(68, 295) scale(0.65)" filter="url(#shadowDark)">
    <circle cx="28" cy="28" r="24" fill="#451a03" stroke="url(#diamondGrad)" stroke-width="2.5" />
    <polygon points="28,14 40,28 28,42 16,28" fill="url(#diamondGrad)" />
  </g>

  <!-- ♣ Bottom-Right Emerald Club -->
  <g transform="translate(404, 295) scale(0.65)" filter="url(#shadowDark)">
    <circle cx="28" cy="28" r="24" fill="#064e3b" stroke="url(#clubGrad)" stroke-width="2.5" />
    <circle cx="28" cy="22" r="7" fill="url(#clubGrad)" />
    <circle cx="21" cy="30" r="7" fill="url(#clubGrad)" />
    <circle cx="35" cy="30" r="7" fill="url(#clubGrad)" />
    <path d="M 26 31 L 24 43 L 32 43 L 30 31 Z" fill="url(#clubGrad)" />
  </g>

  <!-- Bottom Badge: Golden Shelem Pro Banner -->
  <g transform="translate(256, 408)">
    <!-- Decorative Ribbon / Pill behind title -->
    <rect x="-165" y="-36" width="330" height="72" rx="36" fill="#022c22" stroke="url(#goldSheen)" stroke-width="2.5" filter="url(#shadowDark)" />
    
    <!-- Title Text: شلم پرو -->
    <text x="0" y="2" text-anchor="middle" font-family="'Vazirmatn', -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#goldSheen)" filter="url(#goldGlow)" letter-spacing="1">شلم پرو</text>
    
    <!-- English Subtitle: SHELEM PRO -->
    <text x="0" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#34d399" letter-spacing="4">SHELEM PRO</text>
    
    <!-- Four Tiny Suit Dots -->
    <circle cx="-130" cy="-2" r="3.5" fill="#38bdf8" />
    <circle cx="-118" cy="-2" r="3.5" fill="#e11d48" />
    <circle cx="118" cy="-2" r="3.5" fill="#f59e0b" />
    <circle cx="130" cy="-2" r="3.5" fill="#10b981" />
  </g>

  <!-- Gold Star Glints -->
  <path d="M 115 150 Q 115 160 125 160 Q 115 160 115 170 Q 115 160 105 160 Q 115 160 115 150 Z" fill="#fde047" opacity="0.8" />
  <path d="M 390 160 Q 390 170 400 170 Q 390 170 390 180 Q 390 170 380 170 Q 390 170 390 160 Z" fill="#fde047" opacity="0.8" />
</svg>
